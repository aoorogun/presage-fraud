# Local stack: scoring API, Redpanda (Kafka API), MLflow, Prometheus, Grafana.
# Status: written but NOT executed in the build environment (no Docker daemon). Validate with `docker compose config` first.
services:
  api:
    build: .
    ports: ["8000:8000"]
    volumes: ["./data:/app/data", "./reports:/app/reports"]
    depends_on: [redpanda]
  redpanda:
    image: redpandadata/redpanda:latest
    command: [redpanda, start, --overprovisioned, --smp, "1", --memory, 1G, --reserve-memory, 0M, --node-id, "0", --check=false,
              --kafka-addr, "PLAINTEXT://0.0.0.0:9092", --advertise-kafka-addr, "PLAINTEXT://redpanda:9092"]
    ports: ["9092:9092"]
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db
    ports: ["5000:5000"]
    volumes: ["./mlruns_store:/mlflow"]
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    depends_on: [prometheus]
